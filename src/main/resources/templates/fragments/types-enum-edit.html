<div xmlns:th="http://www.thymeleaf.org">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0">
            Edit enum
            <span class="badge bg-secondary ms-2" th:text="${form.schema}">public</span>
            <span class="ms-1" th:text="${form.name}">my_enum</span>
        </h3>
        <a class="btn btn-sm btn-outline-secondary" th:href="@{/types}">Back</a>
    </div>

    <div th:if="${enumType == null}" class="alert alert-warning">Tipo não encontrado.</div>

    <div th:if="${enumType != null}">
        <div class="card shadow-sm mb-3">
            <div class="card-header">Values</div>
            <div class="card-body">
                <table class="table table-sm align-middle">
                    <thead>
                    <tr>
                        <th>#</th>
                        <th>Value</th>
                        <th>Rename to</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="v, iter : ${enumType.values}">
                        <td th:text="${iter.index + 1}"></td>
                        <td><code th:text="${v}"></code></td>
                        <td colspan="2">
                            <form class="d-flex gap-2" method="post" th:action="@{/types/enum/value/rename}">
                                <input type="hidden" name="schema" th:value="${form.schema}">
                                <input type="hidden" name="name" th:value="${form.name}">
                                <input type="hidden" name="renameFrom" th:value="${v}">
                                <input class="form-control form-control-sm" name="renameTo" th:placeholder="${v}">
                                <button class="btn btn-sm btn-outline-secondary" type="submit">Rename</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
                <p class="text-muted small mb-0">
                    O Postgres não permite remover um valor de um enum já criado (apenas adicionar ou renomear).
                </p>
            </div>
        </div>

        <div class="card shadow-sm mb-3">
            <div class="card-header">Add value</div>
            <div class="card-body">
                <form class="row g-2" method="post" th:action="@{/types/enum/value/add}">
                    <input type="hidden" name="schema" th:value="${form.schema}">
                    <input type="hidden" name="name" th:value="${form.name}">
                    <div class="col-auto">
                        <label class="form-label small mb-1">New value</label>
                        <input class="form-control form-control-sm" name="newValue" required>
                    </div>
                    <div class="col-auto">
                        <label class="form-label small mb-1">Position</label>
                        <select class="form-select form-select-sm" name="insertPosition" id="enum-insert-position">
                            <option value="end">At the end</option>
                            <option value="before">Before</option>
                            <option value="after">After</option>
                        </select>
                    </div>
                    <div class="col-auto">
                        <label class="form-label small mb-1">Relative to</label>
                        <select class="form-select form-select-sm" name="relativeToValue" id="enum-relative-value">
                            <option value="">-- value --</option>
                            <option th:each="v : ${enumType.values}" th:value="${v}" th:text="${v}"></option>
                        </select>
                    </div>
                    <div class="col-auto align-self-end">
                        <button class="btn btn-sm btn-primary" type="submit">Add</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card shadow-sm mb-3">
            <div class="card-header">Type settings</div>
            <div class="card-body">
                <form class="row g-2 mb-3" method="post" th:action="@{/types/enum/rename}">
                    <input type="hidden" name="schema" th:value="${form.schema}">
                    <input type="hidden" name="name" th:value="${form.name}">
                    <div class="col-auto">
                        <label class="form-label small mb-1">Rename type to</label>
                        <input class="form-control form-control-sm" name="newTypeName" th:placeholder="${form.name}">
                    </div>
                    <div class="col-auto align-self-end">
                        <button class="btn btn-sm btn-outline-secondary" type="submit">Rename type</button>
                    </div>
                </form>

                <form class="row g-2" method="post" th:action="@{/types/enum/comment}">
                    <input type="hidden" name="schema" th:value="${form.schema}">
                    <input type="hidden" name="name" th:value="${form.name}">
                    <div class="col-8">
                        <label class="form-label small mb-1">Comment</label>
                        <input class="form-control form-control-sm" name="comment" th:value="${enumType.comment}">
                    </div>
                    <div class="col-auto align-self-end">
                        <button class="btn btn-sm btn-outline-secondary" type="submit">Save comment</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card shadow-sm border-danger mb-3">
            <div class="card-header text-danger">Danger zone</div>
            <div class="card-body">
                <form method="post" th:action="@{/types/enum/delete}"
                      onsubmit="return confirm('Excluir o tipo ' + this.schema.value + '.' + this.name.value + '? Isso falhará se ainda houver colunas usando este tipo, a menos que Cascade esteja marcado.');">
                    <input type="hidden" name="schema" th:value="${form.schema}">
                    <input type="hidden" name="name" th:value="${form.name}">
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" name="cascade" value="true" id="enum-cascade">
                        <label class="form-check-label small" for="enum-cascade">
                            Cascade (remove também colunas/objetos dependentes)
                        </label>
                    </div>
                    <button class="btn btn-sm btn-danger" type="submit">Delete type</button>
                </form>
            </div>
        </div>
    </div>
</div>
