<div xmlns:th="http://www.thymeleaf.org">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0">New enum type</h3>
        <a class="btn btn-sm btn-outline-secondary" th:href="@{/types}">Back</a>
    </div>

    <form method="post" th:action="@{/types/enum/new}" th:object="${form}">
        <div class="row g-2 mb-3">
            <div class="col-auto">
                <label class="form-label small mb-1">Schema</label>
                <select class="form-select form-select-sm" th:field="*{schema}">
                    <option value="">-- schema --</option>
                    <option th:each="s : ${schemas}" th:value="${s}" th:text="${s}"></option>
                </select>
            </div>
            <div class="col-auto">
                <label class="form-label small mb-1">Name</label>
                <input class="form-control form-control-sm" placeholder="payment_method" th:field="*{name}">
            </div>
        </div>

        <label class="form-label small mb-1">Values</label>
        <div id="enum-values-body">
            <div class="input-group input-group-sm mb-2" th:each="v, iter : *{values}">
                <input class="form-control" placeholder="value" th:field="*{values[__${iter.index}__]}">
                <button type="button" class="btn btn-outline-danger remove-enum-value-btn">&times;</button>
            </div>
        </div>
        <button type="button" id="add-enum-value-btn" class="btn btn-outline-primary btn-sm mb-3">+ Value</button>

        <div class="mb-3">
            <label class="form-label small mb-1">Comment</label>
            <input class="form-control form-control-sm" th:field="*{comment}">
        </div>

        <button class="btn btn-primary btn-sm" type="submit">Create</button>
    </form>

    <!-- Template used by "+ Value" -->
    <script type="text/template" id="enum-value-row-template">
        <div class="input-group input-group-sm mb-2">
            <input class="form-control" placeholder="value" name="values[__INDEX__]" value="">
            <button type="button" class="btn btn-outline-danger remove-enum-value-btn">&times;</button>
        </div>
    </script>

    <script>
        (function () {
            var body = document.getElementById('enum-values-body');
            var tpl = document.getElementById('enum-value-row-template');
            var addBtn = document.getElementById('add-enum-value-btn');
            var nextIndex = body ? body.querySelectorAll('.input-group').length : 0;

            if (addBtn) {
                addBtn.addEventListener('click', function () {
                    if (!body || !tpl) return;
                    var html = tpl.textContent.replace(/__INDEX__/g, String(nextIndex));
                    nextIndex += 1;
                    var temp = document.createElement('div');
                    temp.innerHTML = html.trim();
                    body.appendChild(temp.firstElementChild);
                });
            }

            document.body.addEventListener('click', function (e) {
                var btn = e.target.closest && e.target.closest('.remove-enum-value-btn');
                if (!btn) return;
                var row = btn.closest('.input-group');
                if (row) row.remove();
            });
        })();
    </script>
</div>
