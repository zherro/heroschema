<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>HeroSchema</title>

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- jQuery + Select2 for searchable selects (used in FK selectors) -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <!-- CodeMirror (SQL editor) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/theme/material.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/hint/show-hint.min.css">
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/sql/sql.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/hint/show-hint.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/hint/sql-hint.min.js"></script>

    <style>
        .CodeMirror {
            height: 70vh;
        }

        /* Ajustes visuais para Select2 com tema Bootstrap 5, alinhado com form-select-sm */
        .select2-container--bootstrap-5 .select2-selection--single {
            height: calc(1.5em + .5rem + 2px);
            padding: 0.125rem 0.5rem;
            font-size: .875rem;
            line-height: 1.5;
        }

        .select2-container--bootstrap-5 .select2-selection--single .select2-selection__rendered {
            padding-right: 1.5rem;
            padding-left: 0;
        }

        .select2-container--bootstrap-5 .select2-selection--single .select2-selection__arrow {
            height: 100%;
            right: 0.25rem;
        }

        .select2-container--bootstrap-5 .select2-selection {
            border-radius: 0.2rem;
        }
    </style>
</head>

<body>

<!-- HEADER -->
<div th:replace="fragments/header :: header"></div>

<!-- BODY -->
<div class="container-fluid">
    <div class="row vh-100">

        <!-- SIDEBAR (opcional) -->
        <aside class="col-3 border-end p-3" th:if="${sidebar} != null">
            <div th:replace="~{${sidebar}}"></div>
        </aside>

        <!-- MAIN -->
        <main class="p-4" th:class="${sidebar} != null ? 'col-9 p-4' : 'col-12 p-4'">
            <div th:if="${message} != null" class="alert alert-success py-2 px-3 small mb-3">
                <span th:text="${message}"></span>
            </div>
            <div th:if="${error} != null" class="alert alert-danger py-2 px-3 small mb-3">
                <span th:text="${error}"></span>
            </div>
            <div th:replace="~{${content}}"></div>
        </main>

    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        if (window.CodeMirror) {
            document.querySelectorAll('textarea.sql-editor').forEach(function (ta) {
                var cm = CodeMirror.fromTextArea(ta, {
                    mode: 'text/x-sql',
                    lineNumbers: true,
                    theme: 'material',
                    viewportMargin: Infinity,
                    extraKeys: {
                        'Ctrl-Space': 'autocomplete'
                    }
                });
                // Keep a direct reference for custom sync routines.
                ta.__cm = cm;

                if (ta.classList.contains('sql-editor-autocomplete')) {
                    cm.on('inputRead', function (editor, change) {
                        if (!change || !change.text || !change.text[0]) return;
                        var token = change.text[0];
                        if (/^[a-zA-Z0-9_\.]+$/.test(token)) {
                            CodeMirror.commands.autocomplete(editor, null, { completeSingle: false });
                        }
                    });
                }
            });
        }

        // Helper: suggested defaults per type
        function isBooleanType(t) {
            if (!t) return false;
            t = t.toLowerCase();
            return t.indexOf('bool') !== -1;
        }

        function isTimestampType(t) {
            if (!t) return false;
            t = t.toLowerCase();
            return t.indexOf('timestamp') !== -1 || t.indexOf('date') !== -1 || t.indexOf('time') !== -1;
        }

        function isNumericType(t) {
            if (!t) return false;
            t = t.toLowerCase();
            return t.indexOf('int') !== -1 || t.indexOf('numeric') !== -1 || t.indexOf('decimal') !== -1 || t.indexOf('double') !== -1 || t.indexOf('real') !== -1;
        }

        // When clicking on a default suggestion, fill the default input according to column type
        document.body.addEventListener('click', function (e) {
            var target = e.target;
            if (!target.classList.contains('default-suggestion')) {
                return;
            }

            var kind = target.getAttribute('data-default-kind');
            var explicit = target.getAttribute('data-default-value');

            var tr = target.closest('tr');
            if (!tr) return;

            var typeSelect = tr.querySelector('select[name$=".type"]');
            var defaultInput = tr.querySelector('input[name$=".defaultValue"]');
            if (!defaultInput) return;

            var type = typeSelect ? typeSelect.value : '';
            var value = explicit;

            if (!value) {
                if (kind === 'timestamp') {
                    value = 'CURRENT_TIMESTAMP';
                } else if (kind === 'boolean') {
                    value = isBooleanType(type) ? 'true' : 'true';
                } else if (kind === 'numeric') {
                    value = isNumericType(type) ? '0' : '0';
                } else if (kind === 'text') {
                    value = "''";
                }
            }

            if (value) {
                defaultInput.value = value;
            }
        });

        // Initialize searchable selects for FK (schema/table/column)
        function refreshFkVisibility(scope) {
            var $scope = scope ? jQuery(scope) : jQuery(document);
            var $rows = $scope.is('tr') ? $scope : $scope.find('tr');
            $rows.each(function () {
                var $tr = jQuery(this);
                var checked = $tr.find('.fk-toggle').is(':checked');
                var $config = $tr.find('.fk-config');
                if (!$config.length) return;
                $config.toggleClass('d-none', !checked);
            });
        }

        function initFkSelects() {
            if (!window.jQuery) {
                return;
            }

            function loadFkSchemas(callback) {
                if (Array.isArray(window.__fkSchemasCache)) {
                    callback(window.__fkSchemasCache);
                    return;
                }

                jQuery.getJSON('/schemas/fk/schemas')
                    .done(function (data) {
                        window.__fkSchemasCache = Array.isArray(data) ? data : [];
                        callback(window.__fkSchemasCache);
                    })
                    .fail(function () {
                        callback([]);
                    });
            }

            function populateSchemaSelects(schemas) {
                jQuery('.fk-schema-select').each(function () {
                    var $schemaSel = jQuery(this);
                    var selected = $schemaSel.val();
                    var hasRealOptions = $schemaSel.find('option').length > 1;
                    if (hasRealOptions) {
                        return;
                    }

                    $schemaSel.empty().append(new Option('schema', '', false, false));
                    schemas.forEach(function (s) {
                        var isSelected = selected === s;
                        $schemaSel.append(new Option(s, s, isSelected, isSelected));
                    });
                    $schemaSel.trigger('change');
                });
            }

            loadFkSchemas(populateSchemaSelects);


            // Bind change handlers only once
            if (window.__fkHandlersInitialized) {
                return;
            }
            window.__fkHandlersInitialized = true;

            // Load tables when schema changes
            jQuery(document).on('change', '.fk-schema-select', function () {
                var $schemaSel = jQuery(this);
                var schema = $schemaSel.val();
                var $tr = $schemaSel.closest('tr');
                var $tableSel = $tr.find('.fk-table-select');
                var $columnSel = $tr.find('.fk-column-select');

                $tableSel.empty().append(new Option('table', '', false, false)).trigger('change');
                $columnSel.empty().append(new Option('column', '', false, false)).trigger('change');

                if (!schema) return;

                jQuery.getJSON('/schemas/fk/tables', {schema: schema})
                    .done(function (data) {
                        data.forEach(function (t) {
                            $tableSel.append(new Option(t, t, false, false));
                        });
                    });
            });

            // Load columns when table changes
            jQuery(document).on('change', '.fk-table-select', function () {
                var $tableSel = jQuery(this);
                var table = $tableSel.val();
                var $tr = $tableSel.closest('tr');
                var $schemaSel = $tr.find('.fk-schema-select');
                var schema = $schemaSel.val();
                var $columnSel = $tr.find('.fk-column-select');

                $columnSel.empty().append(new Option('column', '', false, false)).trigger('change');

                if (!schema || !table) return;

                jQuery.getJSON('/schemas/fk/columns', {schema: schema, table: table})
                    .done(function (data) {
                        data.forEach(function (c) {
                            $columnSel.append(new Option(c, c, false, false));
                        });
                    });
            });
        }

        initFkSelects();
        refreshFkVisibility();

        jQuery(document).on('change', '.fk-toggle', function () {
            refreshFkVisibility(jQuery(this).closest('tr'));
        });

        // New column row helper: clone the row template, append it, optionally prefill values
        var addBtn = document.getElementById('add-column-btn');
        var presetColumnsBtn = document.getElementById('add-preset-columns-btn');
        var tbody = document.getElementById('columns-body');
        var tpl = document.getElementById('column-row-template');

        function addColumnRow(preset) {
            if (!tbody || !tpl) return null;
            var html = tpl.textContent;
            if (!html) return null;

            var nextIndex = parseInt(tbody.getAttribute('data-next-index') || '0', 10);
            html = html.replace(/__INDEX__/g, String(nextIndex));
            tbody.setAttribute('data-next-index', String(nextIndex + 1));

            var temp = document.createElement('tbody');
            temp.innerHTML = html.trim();
            var newRow = temp.firstElementChild;
            if (!newRow) return null;
            tbody.appendChild(newRow);

            // Rebuild the type <select> options from the full server-side list (built-ins +
            // custom enum/domain types) since the row template only has the hardcoded built-ins.
            if (Array.isArray(window.COLUMN_TYPE_OPTIONS)) {
                newRow.querySelectorAll('.col-type-select').forEach(function (select) {
                    var previousValue = select.value;
                    select.innerHTML = '';
                    var blankOption = document.createElement('option');
                    blankOption.value = '';
                    blankOption.textContent = '-- type --';
                    select.appendChild(blankOption);
                    window.COLUMN_TYPE_OPTIONS.forEach(function (t) {
                        var opt = document.createElement('option');
                        opt.value = t;
                        opt.textContent = t;
                        select.appendChild(opt);
                    });
                    select.value = previousValue;
                });
            }

            if (preset) {
                var nameInput = newRow.querySelector('input[name$=".name"]');
                var typeSelect = newRow.querySelector('select[name$=".type"]');
                var nullableInput = newRow.querySelector('input[name$=".nullable"]');
                var defaultInput = newRow.querySelector('input[name$=".defaultValue"]');
                if (nameInput) nameInput.value = preset.name || '';
                if (typeSelect) typeSelect.value = preset.type || '';
                if (nullableInput) nullableInput.checked = !!preset.nullable;
                if (defaultInput) defaultInput.value = preset.defaultValue || '';
            }

            // Re-init FK selects (Select2) and keep everything consistent
            if (typeof jQuery !== 'undefined') {
                initFkSelects();
                refreshFkVisibility(newRow);
            }

            return newRow;
        }

        if (addBtn) {
            addBtn.addEventListener('click', function () {
                addColumnRow();
            });
        }

        // Preset: common tenant/audit columns, added with a single click
        var TENANT_AUDIT_COLUMN_PRESETS = [
            { name: 'tenant_id', type: 'uuid', nullable: false, defaultValue: 'auth.fun_auth_current_tenant_id()' },
            { name: 'created_by', type: 'uuid', nullable: false, defaultValue: 'auth.fun_auth_user_id()' },
            { name: 'created_at', type: 'timestamp with time zone', nullable: true, defaultValue: 'CURRENT_TIMESTAMP' },
            { name: 'updated_at', type: 'timestamp with time zone', nullable: true, defaultValue: 'CURRENT_TIMESTAMP' },
            { name: 'active', type: 'boolean', nullable: false, defaultValue: 'true' }
        ];

        if (presetColumnsBtn) {
            presetColumnsBtn.addEventListener('click', function () {
                TENANT_AUDIT_COLUMN_PRESETS.forEach(function (preset) {
                    addColumnRow(preset);
                });
            });
        }

        // Index edit button: load existing index data into the "New index" form
        document.body.addEventListener('click', function (e) {
            var btn = e.target.closest && e.target.closest('.index-edit-btn');
            if (!btn) return;

            var name = btn.getAttribute('data-index-name') || '';
            var cols = btn.getAttribute('data-index-columns') || '';
            var unique = btn.getAttribute('data-index-unique') === 'true';
            var where = btn.getAttribute('data-index-where') || '';

            var nameInput = document.querySelector('input[name="newIndexName"]');
            var colsInput = document.querySelector('input[name="newIndexColumns"]');
            var uniqueInput = document.querySelector('input[name="newIndexUnique"]');
            var whereInput = document.querySelector('input[name="newIndexWhere"]');
            var editOriginalInput = document.querySelector('input[name="editIndexOriginalName"]');

            if (nameInput) nameInput.value = name;
            if (colsInput) colsInput.value = cols || '';
            if (uniqueInput) uniqueInput.checked = !!unique;
            if (whereInput) whereInput.value = where || '';
            if (editOriginalInput) editOriginalInput.value = name;
        });

        // Policy composer: keep SQL editor in sync while user edits policy fields
        function bindPolicyComposerAutoSync() {
            var form = document.getElementById('policy-composer-form');
            if (!form) return;

            var editor = form.querySelector('textarea[name="policyEditorSql"]');
            if (!editor) return;
            var usingControls = form.querySelector('.policy-using-controls');

            function val(name) {
                var el = form.querySelector('[name="' + name + '"]');
                return el ? (el.value || '').trim() : '';
            }

            function resolveTemplate(key, action, resource, tenantColumn) {
                var templates = {
                    tenant_match: tenantColumn + ' = auth.fun_auth_current_tenant_id()',
                    perm_view: "auth.fun_auth__has_permission('" + resource + "'::text, 'view'::text)",
                    perm_create: "auth.fun_auth__has_permission('" + resource + "'::text, 'create'::text)",
                    perm_update: "auth.fun_auth__has_permission('" + resource + "'::text, 'update'::text)",
                    perm_delete: "auth.fun_auth__has_permission('" + resource + "'::text, 'delete'::text)",
                    company_only: "auth.fun_tenant_type_is('COMPANY'::text)",
                    allow_true: 'true',
                    tenant_and_view: tenantColumn + " = auth.fun_auth_current_tenant_id() AND auth.fun_auth__has_permission('" + resource + "'::text, 'view'::text)",
                    tenant_create_company: tenantColumn + " = auth.fun_auth_current_tenant_id() AND auth.fun_auth__has_permission('" + resource + "'::text, 'create'::text) AND auth.fun_tenant_type_is('COMPANY'::text)"
                };

                if (key === 'action_permission') {
                    var actionPerm = action === 'INSERT' ? 'create' : action.toLowerCase();
                    return "auth.fun_auth__has_permission('" + resource + "'::text, '" + actionPerm + "'::text)";
                }

                return templates[key] || '';
            }

            function autoRenamePolicyNameFromAction() {
                var action = val('policyAction').toLowerCase();
                var table = val('table');
                var role = (val('policyRole') || 'auth_user').toLowerCase().replace(/\s+/g, '_');
                var nameInput = form.querySelector('[name="policyName"]');
                if (!nameInput || !action || !table || !role) return;

                var current = (nameInput.value || '').trim();
                if (!current) {
                    nameInput.value = action + '_' + table + '_' + role;
                    return;
                }

                var m = current.match(/^(select|insert|update|delete)_(.+?)_([a-z0-9_]+)$/i);
                if (m) {
                    nameInput.value = action + '_' + m[2] + '_' + role;
                }
            }

            function refreshPolicyFieldVisibility() {
                var action = val('policyAction').toLowerCase();
                var isInsert = action === 'insert';
                if (usingControls) {
                    usingControls.classList.toggle('d-none', isInsert);
                }
            }

            function buildSql() {
                var schema = val('schema');
                var table = val('table');
                var action = val('policyAction').toUpperCase();
                var policyName = val('policyName');
                var role = val('policyRole') || 'auth_user';
                var preset = val('policyPreset');
                var usingExpr = val('customUsingExpr');
                var withCheckExpr = val('customWithCheckExpr');

                if (!schema || !table) return '-- Fill schema/table';
                if (!policyName) return '-- Fill policy name';
                if (preset !== 'custom') return '-- Use custom mode';
                if (!usingExpr && !withCheckExpr) return '-- Fill USING and/or WITH CHECK';

                var actionsSet = {};
                actionsSet[action] = true;
                var comboSelect = form.querySelector('[name="comboSelect"]');
                var comboInsert = form.querySelector('[name="comboInsert"]');
                var comboUpdate = form.querySelector('[name="comboUpdate"]');
                var comboDelete = form.querySelector('[name="comboDelete"]');
                if (comboSelect && comboSelect.checked) actionsSet['SELECT'] = true;
                if (comboInsert && comboInsert.checked) actionsSet['INSERT'] = true;
                if (comboUpdate && comboUpdate.checked) actionsSet['UPDATE'] = true;
                if (comboDelete && comboDelete.checked) actionsSet['DELETE'] = true;

                var actions = Object.keys(actionsSet).map(function (a) { return a.toLowerCase(); });

                function policyNameForAction(base, act, total) {
                    var role = (val('policyRole') || 'auth_user').toLowerCase().replace(/\s+/g, '_');
                    var tableName = (val('table') || '').toLowerCase();

                    if (total === 1) {
                        return base;
                    }

                    return act + '_' + tableName + '_' + role;
                }

                function onePolicySql(act, name) {
                    var sql = 'CREATE POLICY ' + name + ' ON ' + schema + '.' + table + '\n' +
                        '  FOR ' + act.toUpperCase() + ' TO ' + role;
                    if (act === 'insert') {
                        if (withCheckExpr) sql += ' WITH CHECK (' + withCheckExpr + ')';
                    } else if (act === 'update') {
                        if (usingExpr) sql += ' USING (' + usingExpr + ')';
                        if (withCheckExpr) sql += ' WITH CHECK (' + withCheckExpr + ')';
                    } else {
                        if (usingExpr) sql += ' USING (' + usingExpr + ')';
                    }
                    return sql + ';';
                }

                if (actions.length === 1) {
                    return onePolicySql(actions[0], policyNameForAction(policyName, actions[0], 1));
                }

                var header = '-- Selected actions: ' + actions.map(function (a) { return a.toUpperCase(); }).join(', ');
                var statements = actions.map(function (act) {
                    return onePolicySql(act, policyNameForAction(policyName, act, actions.length));
                });
                return header + '\n' + statements.join('\n\n');
            }

            function syncEditor() {
                var nextSql = buildSql();
                if (editor.__cm) {
                    editor.__cm.setValue(nextSql);
                } else {
                    editor.value = nextSql;
                }
            }

            form.addEventListener('input', function (e) {
                var t = e.target;
                if (!t) return;
                if (t.name === 'policyEditorSql') return;
                if (t.name === 'policyAction') {
                    autoRenamePolicyNameFromAction();
                    refreshPolicyFieldVisibility();
                }
                syncEditor();
            });

            form.addEventListener('change', function (e) {
                var t = e.target;
                if (!t) return;
                if (t.name === 'policyEditorSql') return;

                if (t.name === 'policyAction') {
                    autoRenamePolicyNameFromAction();
                    refreshPolicyFieldVisibility();
                }

                if (t.classList && t.classList.contains('policy-condition-template')) {
                    var targetName = t.getAttribute('data-target');
                    var targetInput = form.querySelector('[name="' + targetName + '"]');
                    if (targetInput && t.value) {
                        var action = val('policyAction').toUpperCase();
                        var resource = val('resourceName') || 'resource';
                        var tenantColumn = val('tenantColumn') || 'tenant_id';
                        targetInput.value = resolveTemplate(t.value, action, resource, tenantColumn);
                    }
                }
                syncEditor();
            });

            // Fill initial draft only when editor is empty.
            var currentEditorValue = editor.__cm ? editor.__cm.getValue() : editor.value;
            if (!currentEditorValue || !currentEditorValue.trim()) {
                autoRenamePolicyNameFromAction();
                refreshPolicyFieldVisibility();
                syncEditor();
            } else {
                refreshPolicyFieldVisibility();
            }
        }

        bindPolicyComposerAutoSync();

        function escapeHtml(text) {
            return String(text || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function initSqlTerminal() {
            var runBtn = document.getElementById('sql-terminal-run');
            var clearBtn = document.getElementById('sql-terminal-clear');
            var copyBtn = document.getElementById('sql-terminal-copy');
            var schemaEl = document.getElementById('sql-terminal-schema');
            var maxRowsEl = document.getElementById('sql-terminal-max-rows');
            var editorEl = document.getElementById('sql-terminal-editor');
            var statusEl = document.getElementById('sql-terminal-status');
            var resultsEl = document.getElementById('sql-terminal-results');
            if (!runBtn || !schemaEl || !editorEl || !resultsEl || !statusEl) return;

            var editor = editorEl.__cm;
            var hintsMap = {};

            function updateStatus(msg, cls) {
                statusEl.className = 'small mt-2 ' + (cls || 'text-muted');
                statusEl.textContent = msg;
            }

            function getEditorValue() {
                return editor ? editor.getValue() : editorEl.value;
            }

            function setEditorValue(value) {
                if (editor) {
                    editor.setValue(value);
                } else {
                    editorEl.value = value;
                }
            }

            function renderResults(payload) {
                if (!payload || !Array.isArray(payload.statements) || payload.statements.length === 0) {
                    resultsEl.innerHTML = '<p class="text-muted small mb-0">No statement results.</p>';
                    return;
                }

                var html = payload.statements.map(function (item, idx) {
                    var header = '<div class="small text-muted mb-2">Statement #' + (idx + 1) +
                        ' (' + escapeHtml(item.elapsedMs) + ' ms)</div>';
                    var sql = '<pre class="small bg-light p-2 border rounded mb-2"><code>' + escapeHtml(item.statement) + '</code></pre>';

                    if (item.kind === 'result_set') {
                        var thead = '<thead><tr>' + (item.columns || []).map(function (c) {
                            return '<th class="small">' + escapeHtml(c) + '</th>';
                        }).join('') + '</tr></thead>';

                        var tbody = '<tbody>' + (item.rows || []).map(function (row) {
                            return '<tr>' + row.map(function (v) {
                                return '<td class="small">' + escapeHtml(v == null ? 'NULL' : String(v)) + '</td>';
                            }).join('') + '</tr>';
                        }).join('') + '</tbody>';

                        var table = '<div class="table-responsive"><table class="table table-sm table-striped table-bordered mb-0">' + thead + tbody + '</table></div>';
                        return '<div class="mb-4">' + header + sql + '<div class="small mb-2">Rows: ' + escapeHtml(item.rowCount) + '</div>' + table + '</div>';
                    }

                    var msg = item.message || 'Statement executed';
                    return '<div class="mb-4">' + header + sql + '<div class="alert alert-info py-2 px-3 small mb-0">' +
                        escapeHtml(msg) + ' (affected rows: ' + escapeHtml(item.rowCount) + ')' +
                        '</div></div>';
                }).join('');

                resultsEl.innerHTML = html;
            }

            function activeSchema() {
                return schemaEl.value || schemaEl.getAttribute('data-selected-schema') || '';
            }

            function setupAutocompleteForSchema(schema) {
                if (!schema || !editor || !window.CodeMirror || !CodeMirror.hint || !CodeMirror.hint.sql) {
                    return;
                }

                if (hintsMap[schema]) {
                    editor.setOption('hintOptions', { tables: hintsMap[schema] });
                    return;
                }

                fetch('/sql-terminal/hints?schema=' + encodeURIComponent(schema))
                    .then(function (r) { return r.json(); })
                    .then(function (data) {
                        var list = Array.isArray(data.suggestions) ? data.suggestions : [];
                        hintsMap[schema] = { __global: list };
                        editor.setOption('hintOptions', { tables: hintsMap[schema] });
                    })
                    .catch(function () {
                        // Ignore autocomplete loading errors to avoid blocking query execution.
                    });
            }

            if (schemaEl) {
                schemaEl.addEventListener('change', function () {
                    var schema = activeSchema();
                    var currentUrl = new URL(window.location.href);
                    currentUrl.searchParams.set('schema', schema);
                    window.history.replaceState({}, '', currentUrl.toString());
                    setupAutocompleteForSchema(schema);
                });
            }

            if (clearBtn) {
                clearBtn.addEventListener('click', function () {
                    setEditorValue('');
                    resultsEl.innerHTML = '<p class="text-muted small mb-0">Editor cleared.</p>';
                    updateStatus('Ready.', 'text-muted');
                });
            }

            if (copyBtn) {
                copyBtn.addEventListener('click', function () {
                    var text = getEditorValue();
                    if (!text.trim()) return;
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(text).then(function () {
                            updateStatus('SQL copied to clipboard.', 'text-success');
                        }).catch(function () {
                            updateStatus('Could not copy SQL automatically.', 'text-warning');
                        });
                        return;
                    }
                    editorEl.focus();
                    editorEl.select();
                    document.execCommand('copy');
                    updateStatus('SQL copied to clipboard.', 'text-success');
                });
            }

            if (editor) {
                editor.on('keydown', function (cm, evt) {
                    var runShortcut = (evt.ctrlKey || evt.metaKey) && evt.key === 'Enter';
                    if (!runShortcut) return;
                    evt.preventDefault();
                    runBtn.click();
                });
            }

            runBtn.addEventListener('click', function () {
                var sql = getEditorValue();
                var schema = activeSchema();
                var maxRows = parseInt((maxRowsEl && maxRowsEl.value) || '200', 10);
                if (!sql || !sql.trim()) {
                    updateStatus('Type a SQL statement first.', 'text-danger');
                    return;
                }

                runBtn.disabled = true;
                updateStatus('Executing...', 'text-warning');

                fetch('/sql-terminal/execute', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        schema: schema,
                        sql: sql,
                        maxRows: maxRows
                    })
                })
                    .then(function (resp) { return resp.json(); })
                    .then(function (payload) {
                        if (!payload.ok) {
                            updateStatus(payload.error || 'Error executing SQL.', 'text-danger');
                            resultsEl.innerHTML = '<div class="alert alert-danger py-2 px-3 small mb-0">' +
                                escapeHtml(payload.error || 'Error executing SQL.') + '</div>';
                            return;
                        }

                        renderResults(payload);
                        updateStatus('Executed ' + payload.statements.length + ' statement(s) on schema ' + payload.schema + '.', 'text-success');
                    })
                    .catch(function (err) {
                        updateStatus('Request failed: ' + (err && err.message ? err.message : 'Unknown error'), 'text-danger');
                    })
                    .finally(function () {
                        runBtn.disabled = false;
                    });
            });

            setupAutocompleteForSchema(activeSchema());
        }

        initSqlTerminal();

        function focusSectionTitle(targetId) {
            if (!targetId) return;
            var el = document.getElementById(targetId);
            if (!el) return;
            el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            if (typeof el.focus === 'function') {
                el.focus({ preventScroll: true });
            }
        }

        // Persist last DDL section selection so focus survives page refresh/redirect.
        document.body.addEventListener('click', function (e) {
            var titleLink = e.target.closest && e.target.closest('.ddl-focus-link');
            if (titleLink) {
                var targetId = titleLink.getAttribute('data-focus-target') || '';
                if (targetId) {
                    sessionStorage.setItem('schemasEditFocusTarget', targetId);
                }
            }

            var copyBtn = e.target.closest && e.target.closest('.copy-ddl-btn');
            if (!copyBtn) return;

            var target = copyBtn.getAttribute('data-copy-target');
            var source = target ? document.getElementById(target) : null;
            if (!source) return;

            var text = source.value || source.textContent || '';
            if (!text.trim()) return;

            function markCopied() {
                var original = copyBtn.textContent;
                copyBtn.textContent = 'Copied';
                setTimeout(function () {
                    copyBtn.textContent = original;
                }, 1200);
            }

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(markCopied);
                return;
            }

            source.focus();
            source.select();
            document.execCommand('copy');
            markCopied();
        });

        var params = new URLSearchParams(window.location.search);
        var hashTarget = window.location.hash ? window.location.hash.substring(1) : '';
        var queryTarget = params.get('focus') || '';
        var storedTarget = sessionStorage.getItem('schemasEditFocusTarget') || '';
        var initialTarget = hashTarget || queryTarget || storedTarget;
        if (initialTarget) {
            setTimeout(function () {
                focusSectionTitle(initialTarget);
            }, 60);
        }
    });
</script>

</body>
</html>
